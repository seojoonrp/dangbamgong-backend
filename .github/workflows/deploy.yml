name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dangbamgong-backend:latest
            ghcr.io/${{ github.repository_owner }}/dangbamgong-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p /opt/dangbamgong/auth
            echo "${{ secrets.APPLE_AUTH_KEY_P8 }}" > /opt/dangbamgong/auth/AuthKey.p8

            docker pull ghcr.io/${{ github.repository_owner }}/dangbamgong-backend:latest
            docker stop dangbamgong-api || true
            docker rm dangbamgong-api || true

            docker run -d --name dangbamgong-api \
              --restart unless-stopped \
              --network caddy-net \
              --env-file /opt/dangbamgong/.env \
              -v /opt/dangbamgong/auth:/app/auth:ro \
              ghcr.io/${{ github.repository_owner }}/dangbamgong-backend:latest

            docker image prune -f
